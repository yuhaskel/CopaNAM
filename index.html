<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#NAMLEAGUE 2026</title>
    <link rel="stylesheet" href="style.css">
    <style>
    /* Estilos exclusivos para la pantalla de selección */
    .welcome-container {
        display: flex;
        height: 100vh;
        width: 100vw;
        flex-direction: row;
        background-color: #000214; /* Fondo oscuro profundo */
    }

    .branch-side {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
    }

    /* Lado Femenino: Tu degradado morado actual */
    .side-femenina {
        background: linear-gradient(135deg, #1f0b2a 0%, #000214 100%);
        border-right: 1px solid rgba(255, 255, 255, 0.05);
        cursor: pointer; /* LIBERADO: Cambiado de 'not-allowed' a manito de clic */
    }
    .side-femenina:hover {
        background: linear-gradient(135deg, #42105c 0%, #000214 100%);
    }

    /* Lado Masculino: COLORES NUEVOS DE LA IMAGEN (Azul Neón Eléctrico) */
    .side-masculina {
        background: linear-gradient(135deg, #001f75 0%, #000214 100%);
    }
    .side-masculina:hover {
        background: linear-gradient(135deg, #002db3 0%, #000214 100%);
    }

    /* Estilos de los títulos y efectos Glow */
    .logo-title {
        font-size: 3rem;
        font-weight: 900;
        letter-spacing: 2px;
        margin-bottom: 5px;
        transition: transform 0.3s ease;
    }

    /* ADORNO: Estructura base animada para los textos de abajo */
    .branch-title {
        font-size: 1.6rem;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 6px;
        opacity: 0.05;
        text-transform: capitalize;
        position: relative;
        padding-bottom: 8px;
        margin-top: 10px;
        transition: all 0.4s ease;
    }

    /* ADORNO: Línea base que se expandirá en Hover */
    .branch-title::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 0;
        height: 2px;
        transform: translateX(-50%);
        transition: all 0.4s ease;
    }

    /* Asignar color de línea neón específico a cada rama en Hover */
    .side-femenina:hover .branch-title::after {
        width: 80%;
        background: #ff33ff;
        box-shadow: 0 0 10px #ff33ff, 0 0 20px #ff33ff;
    }

    .side-masculina:hover .branch-title::after {
        width: 80%;
        background: #00d2ff;
        box-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff;
    }

    /* ADORNO: Brillo de texto personalizado al pasar el mouse */
    .side-femenina:hover .branch-title {
        opacity: 1;
        color: #ffb3ff;
        text-shadow: 0 0 10px rgba(255, 51, 255, 0.6);
        letter-spacing: 8px;
    }

    .side-masculina:hover .branch-title {
        opacity: 1;
        color: #b3f2ff;
        text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
        letter-spacing: 8px;
    }

    /* El signo # blanco puro */
    .txt-hashtag {
        color: #ffffff;
    }

    /* --- PALETA MASCULINA --- */
    .txt-cyan-neon { 
        color: #00d2ff; 
        text-shadow: 0 0 15px rgba(0, 210, 255, 0.6), 0 0 30px rgba(0, 210, 255, 0.3);
    }

    .txt-red-neon {
        color: #ff3333;
        text-shadow: 0 0 15px rgba(255, 51, 51, 0.6), 0 0 30px rgba(255, 51, 51, 0.3);
    }

    /* --- PALETA FEMENINA CORREGIDA --- */
    .txt-rosado-neon {
        color: #ff33ff;
        text-shadow: 0 0 15px rgba(255, 51, 255, 0.7), 0 0 30px rgba(255, 51, 255, 0.4);
    }
    
    .txt-celeste-neon {
        color: #6efff8;
        text-shadow: 0 0 15px rgba(110, 255, 248, 0.7), 0 0 30px rgba(110, 255, 248, 0.4);
    }

    /* Hover del logotipo principal */
    .branch-side:hover .logo-title {
        transform: scale(1.05);
    }

    /* Adaptabilidad para celulares */
    @media (max-width: 768px) {
        .welcome-container {
            flex-direction: column;
        }
        .side-femenina {
            border-right: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .logo-title { font-size: 2.3rem; }
        .branch-title { font-size: 1.3rem; }
    }
</style>
</head>
<body>
    <div class="welcome-container">
        <!-- Lado Femenino: Enrutado directamente a la rama femenina -->
        <a href="liga.html?rama=femenina" class="branch-side side-femenina">
            <h1 class="logo-title">
                <span class="txt-hashtag">#</span><span class="txt-celeste-neon">N</span><span class="txt-rosado-neon">A</span><span style="color: #ffffff;">MLEAGUE</span>
            </h1>
            <span class="branch-title">Femenina</span>
            <span class="branch-title" style="font-size: 0.9rem; color: #ff33ff; text-shadow: 0 0 10px rgba(255,51,255,0.6); letter-spacing: 2px; margin-top: 5px;"></span>
        </a>

        <!-- Lado Masculino: Direcciona directo a la liga actual -->
        <a href="liga.html?rama=masculina" class="branch-side side-masculina">
            <h1 class="logo-title">
                <span class="txt-hashtag">#</span><span class="txt-cyan-neon">N</span><span class="txt-red-neon">A</span><span style="color: #ffffff;">MLEAGUE</span>
            </h1>
            <span class="branch-title">Masculina</span>
        </a>
    </div>
</body>
</html>
